services:
  db:
    image: postgres:12
    environment:
      - "POSTGRES_DB=rshd"
      - "POSTGRES_PASSWORD=1234"
    ports:
      - "6666:5432"
    networks:
      - rshd-network
    command: ["postgres", "-c", "log_statement=all", "-c", "timezone=UTC"]
  spring-app:
    build:
      context: .
      dockerfile: ./Dockerfile
    ports:
      - "9091:8080"
    depends_on:
      - db
    networks:
      - rshd-network
networks:
  rshd-network:
    driver: bridge

